syntax = "proto3";

package deq.coordinator;

import "google/protobuf/empty.proto";
import "deq_bin.proto";
import "util.proto";

service Coordinator {
  // load the library, preferably offline (well before the circuit runs) but can
  // also run online to enable the capability of very dynamic behaviors
  rpc LoadLibrary(deq.bin.Library) returns (google.protobuf.Empty);
  // remove certain gadgets, check models or error models to free up resources
  rpc Unload(UnloadLibrary) returns (google.protobuf.Empty);
  // return the id of the new instruction (which creates an instance of a
  // gadget, a check model or an error model)
  rpc Execute(deq.bin.Instruction) returns (ExecuteResponse);
  // input the measurement outcomes of a gadget and return the logical readouts.
  // note that the readouts generally depend on adjacent gadgets' outcomes so
  // it may not return immediately (unless the number of readouts are zero)
  rpc Decode(Outcomes) returns (Readouts);
  // publish a gadget's raw measurement outcomes as soon as they exist, before
  // its decode is requested — lets detector-conditioned control flow resolve
  // at measurement time. decode() later re-sends the same bits idempotently.
  rpc SubmitOutcomes(Outcomes) returns (google.protobuf.Empty);
  // return a gadget's finished-detector bits (its check-model syndrome) as soon
  // as its checks are finished, WITHOUT waiting for the BP decode. The response
  // populates only the `detectors` field of Readouts.
  rpc WaitForDetectors(DetectorRequest) returns (Readouts);
  // reset the system
  rpc Reset(ResetRequest) returns (google.protobuf.Empty);
  // drain the DEM growth increments (detector groups + resolved error edges)
  // that became visible since the previous drain — the decoding-graph view's
  // structural data source. Recording must be enabled via SetDemEnabled.
  rpc DrainDem(google.protobuf.Empty) returns (DemDrainResponse);
  // drain the queued per-decode DEM predictions. An absent `gid` drains every
  // queued prediction; a present `gid` drains only that decoded gadget's,
  // leaving the rest queued for their owning decode.
  rpc DrainDemPredictions(DemPredictionsRequest) returns (DemPredictionsResponse);
  // enable/disable DEM recording. The server starts with recording DISABLED;
  // the playground turns it on per replay shot.
  rpc SetDemEnabled(DemEnabledRequest) returns (google.protobuf.Empty);
  // drain the per-window decode timing records accumulated since the previous
  // drain (or reset). Always recorded — unlike the DEM log there is no enable
  // flag; records are ~30 scalars per window decode.
  rpc DrainWindowTimings(google.protobuf.Empty) returns (WindowTimingsResponse);
}

// A global DEM id pair — (cid, check_index) for a detector, or
// (eid, error_index) for an error mechanism.
message DemGlobalId {
  uint64 a = 1;
  uint64 b = 2;
}

// One Create::CheckModel: `count` new detectors (cid, 0..count) owned by
// gadget `gid`.
message DemDetectorGroup {
  uint64 gid = 1;
  uint64 cid = 2;
  uint64 count = 3;
}

// One error mechanism, fully resolved to global detector ids.
message DemEdge {
  uint64 gid = 1;
  uint64 eid = 2;
  uint64 error_index = 3;
  // global detector ids (cid, check_index) — check_bias already applied
  repeated DemGlobalId detectors = 4;
  double probability = 5;
}

// Everything that became visible since the previous DrainDem.
message DemDrainResponse {
  repeated DemDetectorGroup detector_groups = 1;
  repeated DemEdge edges = 2;
}

// One BP decode's window report, in global ids, for the decoding-graph view.
message DemPrediction {
  uint64 gid = 1;
  uint64 seq = 2;
  repeated uint64 window_gids = 3;
  // (eid, error_index)
  repeated DemGlobalId committed_edges = 4;
  repeated DemGlobalId buffer_edges = 5;
  repeated DemGlobalId fired = 6;
  repeated DemGlobalId fired_buffer = 7;
  // (cid, check_index)
  repeated DemGlobalId flips = 8;
}

// absent `gid` = drain all queued predictions
message DemPredictionsRequest {
  optional uint64 gid = 1;
}

message DemPredictionsResponse {
  repeated DemPrediction predictions = 1;
}

message DemEnabledRequest {
  bool enabled = 1;
}

message DetectorRequest {
  // the gid of the gadget whose finished-detector bits to return
  uint64 gid = 1;
}

message UnloadLibrary {
  repeated uint64 gtype = 1;
  repeated uint64 ctype = 2;
  repeated uint64 etype = 3;
}

message ResetRequest {
  // by default keep all the library data intact; resetting this only if a
  // completely new library is required
  bool reset_library = 1;
  // by default keeping all the decoder instances intact if such feature is
  // supported; resetting the decoder service every time is useful for dynamic
  // decoding where the decoder instances cannot be reused
  bool reset_decoder_service = 2;
  // other custom things
  string custom = 200;
}

message ExecuteResponse {
  // the id is either gid (gadget), cid (check model) or eid (error model)
  // depending on the instruction
  uint64 id = 1;
}

message Outcomes {
  // the gid of the gadget
  uint64 gid = 1;
  // the measurement outcomes, length must be equal to the number of
  // measurements of the gadget type
  deq.util.BitVector outcomes = 2;
  // modify the probabilities based on soft information; note that later
  // modifications will overwrite the existing ones, so use sparse modifier as
  // much as possible to avoid potential issues; the length of the modifier must
  // be less than the number of error models attached to the gadget. Here we
  // implicitly enforce that each gadget can only modify local error models,
  // which makes sense as modifying history error model probabilities
  // complicates the decoding system coordination (e.g., do we recompute the
  // committed part or not?)
  repeated deq.bin.ProbabilityModifier modifiers = 3;
  // optional per-measurement loss flags, one bit per measurement in `outcomes`.
  // A set bit means the corresponding qubit was lost during that measurement,
  // and the bit in `outcomes` is therefore unreliable (typically a random
  // substitute filled in by the simulator).  When absent, no loss information
  // is available for this batch and the decoder should treat every measurement
  // bit as reliable.  Decoders are free to ignore this field; no decoder is
  // required to consume it.
  deq.util.BitVector loss_mask = 4;
}

message Readouts {
  // the gid of the gadget
  uint64 gid = 1;
  // the readout results; length must be equal to the number of
  // logical readouts of the gadget type
  deq.util.BitVector readouts = 2;
  // optionally, output logical soft information: the estimated probability
  // of a logical readout being wrong; if provided, the length must be equal to
  // the number of readouts in the gadget
  repeated double probabilities = 3;
  // the gadget's finished-detector parities (its check-model syndrome),
  // populated by Decode and WaitForDetectors
  deq.util.BitVector detectors = 4;
}

// How decode_parity_factor obtained its decoding hypergraph.
enum DecodePath {
  // reused an already-loaded hypergraph (decode_loaded, zero construction)
  CACHE_HIT = 0;
  // persistent decoder, first encounter: built + load_hypergraph + decode_loaded
  BUILT_LOADED = 1;
  // non-persistent config: built + inline decode (no load step)
  TEMPORARY = 2;
}

// Wall-clock timing of one window decode. All *_ns timestamps share the
// process-monotonic origin of timestamp_ns(); durations are plain ns.
// Construction phases (build/merge/compact/load) are 0 on CACHE_HIT.
message WindowTiming {
  // monotone per-shot counter, assigned by the timing log in push order
  uint64 seq = 1;
  repeated uint64 window_gids = 2;
  // max over the window's check models of their syndrome-complete time
  // (0 when unknown, e.g. monolithic approximates with decode entry)
  uint64 syndrome_ready_ns = 3;
  uint64 decode_start_ns = 4;
  uint64 decode_end_ns = 5;
  // window-exploration compute (select_commit_region + shrink_window); 0 monolithic
  uint64 explore_ns = 6;
  uint64 build_ns = 7;    // decoding_hypergraph()
  uint64 merge_ns = 8;    // hyperedge merging (0 if merge_hyperedges off)
  uint64 compact_ns = 9;  // compact_vertices (0 monolithic)
  uint64 load_ns = 10;    // load_hypergraph into the decoder service
  uint64 decode_ns = 11;  // the decode / decode_loaded call, client-observed
  DecodePath path = 12;
  uint32 syndrome_weight = 13;    // fired detectors (popcount of the syndrome)
  uint32 correction_weight = 14;  // parity_factor.subgraph.len()
  uint32 num_hyperedges = 15;
  uint32 num_vertices = 16;
  uint32 num_gadgets = 17;        // decoder-window gadget count
  uint32 num_committing = 18;     // commit-region gadget count (== num_gadgets monolithic)
  uint32 concurrent_decodes = 19; // decodes in flight when this one started (incl. self)
  uint32 cache_size = 20;         // loaded_decoders entries after this decode
  uint64 syndrome_bytes = 21;     // syndrome BitVector payload bytes
  uint64 parity_factor_bytes = 22; // encoded_len of the returned ParityFactor
  uint64 hypergraph_bytes = 23;   // encoded_len of the hypergraph at load; 0 on CACHE_HIT
  // decoder-side compute reported by the decoder service (ParityFactor.compute_ns);
  // comms overhead = decode_ns - decoder_compute_ns
  uint64 decoder_compute_ns = 24;
  // decode() handler entry of this window's leader gadget (server clock).
  // Monolithic approximates with the decode entry (== decode_start_ns).
  uint64 leader_arrived_ns = 25;
  // step-2 mandatory-zone syndrome wait completed (server clock).
  // Monolithic approximates with the decode entry (== decode_start_ns).
  uint64 mandatory_ready_ns = 26;
  // decode_start -> first construction phase: syndrome-vector assembly from the
  // window's check models + decoder cache-key fingerprinting (incl. the
  // error_model_types/error_models read-lock acquisition). The front of the
  // decode handler that has no other phase counter.
  uint64 prep_ns = 27;
  // decode-call end -> decode_end: post-decode bookkeeping (DEM prediction
  // recording, parity-factor serialization, decode-finished event). Computed as
  // the exact remainder of (decode_end - decode_start) once every other phase is
  // subtracted, so prep+build+merge+compact+load+decode+finalize tiles the whole
  // [decode_start, decode_end] span with no unaccounted gap.
  uint64 finalize_ns = 28;
}

// The first time a gadget's measurement outcomes are set on a coordinator
// (via SubmitOutcomes or Decode), stamped with the server clock.
message OutcomeArrival {
  uint64 gid = 1;
  uint64 received_ns = 2;
}

message WindowTimingsResponse {
  repeated WindowTiming timings = 1;
  // Server clock (timestamp_ns() origin — the same clock every WindowTiming
  // timestamp uses) at the moment this drain was answered. Lets the client
  // convert server timestamps into its own timeline (clock synchronization).
  uint64 drained_at_ns = 2;
  // Per-gid outcome-arrival stamps accumulated since the previous drain,
  // cleared here and on reset (same lifecycle as `timings`).
  repeated OutcomeArrival outcome_arrivals = 3;
}
